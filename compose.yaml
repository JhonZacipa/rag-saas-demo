# Local stack.
#   docker compose up -d --wait postgres      -> only the database (daily development)
#   docker compose --profile app up -d --build -> database + backend + frontend in containers
name: rag-saas-demo

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-rag}
    ports:
      # Bound to localhost only, so the database is not exposed to the local network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18 images keep their data under /var/lib/postgresql/18.
      - pgdata:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    profiles: ["app"]
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    environment:
      APP_ENV: local
      LOG_JSON: "true"
      DATABASE_URL: postgresql://${POSTGRES_USER:-rag}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-rag}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8010}:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    profiles: ["app"]
    build:
      context: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3010}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
