# Checks that run on every `git commit`. Install the hook once with `just setup`.
# Run them on demand with `uv run pre-commit run --all-files`.

# Generated files are checked by the CI contract job, not reformatted here.
exclude: ^frontend/(openapi\.json|src/lib/api/schema\.d\.ts)$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: check-yaml
        # pnpm lockfiles are multi-document YAML generated by pnpm itself.
        exclude: pnpm-lock\.yaml$
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: (pnpm-lock\.yaml|uv\.lock)$

  # Local hooks use the project's own environments, so versions match the lockfiles.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: biome
        name: biome
        entry: pnpm --dir frontend exec biome check --write
        language: system
        files: ^frontend/
        pass_filenames: false
