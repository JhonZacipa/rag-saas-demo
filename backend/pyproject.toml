[project]
name = "rag-saas-backend"
version = "0.1.0"
description = "Backend of the dental clinic assistant: FastAPI + LangGraph."
requires-python = ">=3.13,<3.14"
# Proprietary, see the LICENSE file at the repository root.
license = "LicenseRef-Proprietary"
# PyPI rejects packages with this classifier, which prevents an accidental upload.
classifiers = ["Private :: Do Not Upload"]
dependencies = [
  "fastapi[standard]>=0.165",
  "loguru>=0.8",
  "psycopg[binary]>=3.3",
  "pydantic-settings>=2.16",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
